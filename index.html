<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishing Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎣 Fishing Tracker</h1>
        <p>Keep track of your fishing trips and catches.</p>

        <nav>
            <a href="/stats">View Statistics</a>
            <a href="/catches">View Catch Log</a>
        </nav>
    </header>

    <main>

        <section id="catch-form">
            <h2>Record a Catch</h2>

            <input
                type="text"
                id="species"
                placeholder="Fish Species"
            >

            <input
                type="text"
                id="location"
                placeholder="Location"
            >

            <input
                type="number"
                id="length"
                placeholder="Length (inches)"
            >

            <input
                type="text"
                id="lure"
                placeholder="Lure or Fly Used"
            >

            <input
                type="date"
                id="date"
            >

            <button id="add-catch" type="button">
                Add Catch
            </button>
        </section>

        <section id="statistics">
            <h2>Fishing Statistics</h2>

            <div class="statistics-grid">
                <div class="stat-card">
                    <span class="stat-label">Total Fish</span>
                    <strong id="total-fish">0</strong>
                </div>

                <div class="stat-card">
                    <span class="stat-label">Largest Fish</span>
                    <strong id="largest-fish">None</strong>
                </div>

                <div class="stat-card">
                    <span class="stat-label">Total Inches</span>
                    <strong id="total-inches">0</strong>
                </div>

                <div class="stat-card">
                    <span class="stat-label">Average Length</span>
                    <strong>
                        <span id="average-length">0</span> inches
                    </strong>
                </div>
            </div>
        </section>

        <section id="chart-section">
            <h2>Catch Length Chart</h2>
            <p>Compare the lengths of your recorded fish.</p>

            <div id="chart-container">
                <canvas id="catch-chart"></canvas>
            </div>
        </section>

        <section id="catch-list">
            <h2>My Catches</h2>

            <div class="filter-controls">
                <div class="filter-field">
                    <label for="search">Species</label>
                    <input
                        type="text"
                        id="search"
                        placeholder="Search species..."
                    >
                </div>

                <div class="filter-field">
                    <label for="location-filter">Location</label>
                    <input
                        type="text"
                        id="location-filter"
                        placeholder="Search location..."
                    >
                </div>

                <div class="filter-field">
                    <label for="min-length-filter">Minimum Length</label>
                    <input
                        type="number"
                        id="min-length-filter"
                        placeholder="Inches"
                        min="0"
                    >
                </div>

                <div class="filter-field">
                    <label for="sort-catches">Sort By</label>
                    <select id="sort-catches">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="largest">Largest Fish First</option>
                        <option value="smallest">Smallest Fish First</option>
                    </select>
                </div>

                <button id="clear-filters" type="button">
                    Clear Filters
                </button>
            </div>

            <div id="catches"></div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>

</body>
</html>
